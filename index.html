<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo en Vivo - GitHub Pages</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-slate-800 rounded-2xl p-8 shadow-2xl border border-slate-700 text-center">
    <span class="px-3 py-1 text-xs font-semibold bg-emerald-500/20 text-emerald-400 rounded-full border border-emerald-500/30">
      ● Servidor Online
    </span>
    <h1 class="text-3xl font-bold mt-4 mb-2">¡Despliegue Exitoso! 🚀</h1>
    <p class="text-slate-400 text-sm mb-6">
      Esta página está corriendo en vivo directamente desde un repositorio de GitHub Pages.
    </p>
    <button id="btnTest" class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-500 font-medium rounded-xl transition cursor-pointer">
      Probar interactividad JS (Clics: <span id="contador">0</span>)
    </button>
  </div>

  <script>
    let clics = 0;
    document.getElementById('btnTest').addEventListener('click', () => {
      clics++;
      document.getElementById('contador').textContent = clics;
    });
  </script>
</body>
</html>
